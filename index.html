    <link rel="canonical" href="https://wzayush.vercel.app/" />

    <meta property="og:site_name" content="Ayush Danthta" />
    <meta property="og:title" content="Ayush Danthta — Designer & Developer" />
    <meta
      property="og:description"
      content="Cinematic portfolio and web studio: live projects, twenty website concepts, and a direct way to start a project."

      content="Cinematic portfolio and web studio: live projects, twenty website concepts, and a direct way to start a project."

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Structured data. Only facts that are actually on the page: who this is,
      what the site is, and the live URLs it links to.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ayush Danthta",
        "jobTitle": "Designer & Developer",
        "email": "mailto:ayushdanthta@gmail.com",
        "url": "https://wzayush.vercel.app/",
        "sameAs": [
          "https://github.com/WizardAyush0099",
          "https://wizardayush0099.github.io/WZ-Ayush/"
        ]
      }
    </script>
  </head>
  <body>
    <!--
      Paint the saved theme before the app boots so there is never a flash of
      the default palette. Key must match STORAGE_KEY in src/lib/theme.ts.
    -->
    <script>
      try {
        var t = localStorage.getItem("wz.theme.v1");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

      <stop offset="0%" stop-color="#4d0509"/>
      <stop offset="38%" stop-color="#a50d17"/>
      <stop offset="72%" stop-color="#d92a33"/>
      <stop offset="100%" stop-color="#6d0810"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="#fbf9f5"/>
  <circle cx="200" cy="200" r="199" fill="none" stroke="rgba(18,15,13,0.10)" stroke-width="1.4"/>
  <text x="155" y="224" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="200" letter-spacing="2" fill="#12100e">W</text>
  <text x="271" y="224" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="200" fill="#12100e">Z</text>
  <path d="M 92 256 C 100 248 108 248 116 244 L 338 108 C 348 102 354 110 348 118 L 122 264 C 112 270 100 270 94 262 C 90 258 90 258 92 256 Z" fill="url(#w-logo-blade)"/>

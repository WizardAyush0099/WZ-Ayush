<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Guitar Theory Lab fretboard interface">
  <defs>
    <linearGradient id="gt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0809"/>
      <stop offset="0.6" stop-color="#060304"/>
      <stop offset="1" stop-color="#030202"/>
    </linearGradient>
    <radialGradient id="gt-glow" cx="0.5" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#d61f26" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#8c0b10" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#8c0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gt-neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1418"/>
      <stop offset="1" stop-color="#0a0709"/>
    </linearGradient>
    <linearGradient id="gt-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.012"/>
    </linearGradient>
    <radialGradient id="gt-note">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="1" stop-color="#b31115"/>
    </radialGradient>
    <filter id="gt-blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="gt-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#gt-bg)"/>
  <rect width="1600" height="1000" fill="url(#gt-glow)"/>
  <ellipse cx="1240" cy="150" rx="420" ry="200" fill="#d61f26" opacity="0.12" filter="url(#gt-blur)"/>

  <!-- scale legend -->
  <g transform="translate(120 120)">
    <rect x="0" y="0" width="520" height="56" rx="8" fill="url(#gt-card)" stroke="#ece7e1" stroke-opacity="0.1"/>
    <rect x="22" y="20" width="140" height="16" rx="8" fill="#ece7e1" fill-opacity="0.18"/>
    <g transform="translate(300 28)">
      <circle r="9" fill="url(#gt-note)"/>
      <rect x="20" y="-5" width="70" height="10" rx="5" fill="#ece7e1" fill-opacity="0.12"/>
    </g>
    <g transform="translate(420 28)">
      <circle r="9" fill="#0a0709" stroke="#ece7e1" stroke-opacity="0.35"/>
      <rect x="20" y="-5" width="70" height="10" rx="5" fill="#ece7e1" fill-opacity="0.12"/>
    </g>
  </g>

  <!-- fretboard -->
  <g transform="translate(120 230)">
    <rect x="0" y="0" width="1360" height="440" rx="14" fill="url(#gt-neck)" stroke="#ece7e1" stroke-opacity="0.12"/>
    <!-- frets -->
    <g stroke="#ece7e1" stroke-opacity="0.14">
      <line x1="120" y1="20" x2="120" y2="420"/>
      <line x1="220" y1="20" x2="220" y2="420"/>
      <line x1="320" y1="20" x2="320" y2="420"/>
      <line x1="420" y1="20" x2="420" y2="420"/>
      <line x1="520" y1="20" x2="520" y2="420"/>
      <line x1="620" y1="20" x2="620" y2="420"/>
      <line x1="720" y1="20" x2="720" y2="420"/>
      <line x1="820" y1="20" x2="820" y2="420"/>
      <line x1="920" y1="20" x2="920" y2="420"/>
      <line x1="1020" y1="20" x2="1020" y2="420"/>
      <line x1="1120" y1="20" x2="1120" y2="420"/>
      <line x1="1220" y1="20" x2="1220" y2="420"/>
    </g>
    <!-- nut -->
    <rect x="30" y="16" width="14" height="408" rx="4" fill="#ece7e1" fill-opacity="0.3"/>
    <!-- inlays -->
    <g fill="#ece7e1" fill-opacity="0.18">
      <circle cx="320" cy="220" r="8"/>
      <circle cx="420" cy="220" r="8"/>
      <circle cx="620" cy="220" r="8"/>
      <circle cx="820" cy="220" r="8"/>
    </g>
    <!-- strings -->
    <g stroke="#ece7e1" stroke-opacity="0.34">
      <line x1="30" y1="58" x2="1330" y2="58" stroke-width="1"/>
      <line x1="30" y1="119" x2="1330" y2="119" stroke-width="1.4"/>
      <line x1="30" y1="180" x2="1330" y2="180" stroke-width="1.8"/>
      <line x1="30" y1="241" x2="1330" y2="241" stroke-width="2.2"/>
      <line x1="30" y1="302" x2="1330" y2="302" stroke-width="2.6"/>
      <line x1="30" y1="363" x2="1330" y2="363" stroke-width="3"/>
    </g>
    <!-- highlighted scale tones -->
    <g>
      <circle cx="170" cy="58" r="17" fill="url(#gt-note)"/>
      <circle cx="170" cy="241" r="17" fill="url(#gt-note)"/>
      <circle cx="370" cy="119" r="17" fill="url(#gt-note)"/>
      <circle cx="470" cy="302" r="17" fill="url(#gt-note)"/>
      <circle cx="570" cy="180" r="17" fill="url(#gt-note)"/>
      <circle cx="570" cy="363" r="17" fill="url(#gt-note)"/>
      <circle cx="670" cy="58" r="17" fill="url(#gt-note)"/>
      <circle cx="770" cy="241" r="17" fill="url(#gt-note)"/>
      <circle cx="970" cy="119" r="17" fill="url(#gt-note)"/>
      <circle cx="1070" cy="302" r="17" fill="url(#gt-note)"/>
      <circle cx="1170" cy="180" r="17" fill="url(#gt-note)"/>
      <circle cx="1270" cy="363" r="17" fill="url(#gt-note)"/>
    </g>
    <g fill="none" stroke="#ece7e1" stroke-opacity="0.3" stroke-width="2">
      <circle cx="270" cy="119" r="17"/>
      <circle cx="270" cy="363" r="17"/>
      <circle cx="470" cy="180" r="17"/>
      <circle cx="670" cy="241" r="17"/>
      <circle cx="870" cy="58" r="17"/>
      <circle cx="1070" cy="241" r="17"/>
      <circle cx="1270" cy="119" r="17"/>
    </g>
    <!-- fret numbers -->
    <g fill="#ece7e1" fill-opacity="0.2" font-family="monospace" font-size="13" text-anchor="middle">
      <text x="170" y="443">1</text><text x="270" y="443">2</text><text x="370" y="443">3</text>
      <text x="470" y="443">4</text><text x="570" y="443">5</text><text x="670" y="443">6</text>
      <text x="770" y="443">7</text><text x="870" y="443">8</text><text x="970" y="443">9</text>
      <text x="1070" y="443">10</text><text x="1170" y="443">11</text><text x="1270" y="443">12</text>
    </g>
  </g>

  <!-- chord panels -->
  <g transform="translate(120 720)">
    <rect x="0" y="0" width="430" height="180" rx="12" fill="url(#gt-card)" stroke="#ece7e1" stroke-opacity="0.1"/>
    <rect x="28" y="28" width="120" height="14" rx="7" fill="#ece7e1" fill-opacity="0.18"/>
    <g transform="translate(28 74)" stroke="#ece7e1" stroke-opacity="0.2">
      <line x1="0" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="26" x2="150" y2="26"/>
      <line x1="0" y1="52" x2="150" y2="52"/>
      <line x1="0" y1="78" x2="150" y2="78"/>
      <line x1="0" y1="0" x2="0" y2="78"/>
      <line x1="30" y1="0" x2="30" y2="78"/>
      <line x1="60" y1="0" x2="60" y2="78"/>
      <line x1="90" y1="0" x2="90" y2="78"/>
      <line x1="120" y1="0" x2="120" y2="78"/>
      <line x1="150" y1="0" x2="150" y2="78"/>
    </g>
    <g transform="translate(28 74)">
      <circle cx="30" cy="13" r="8" fill="url(#gt-note)"/>
      <circle cx="90" cy="26" r="8" fill="url(#gt-note)"/>
      <circle cx="120" cy="52" r="8" fill="url(#gt-note)"/>
    </g>
    <rect x="240" y="60" width="160" height="110" rx="8" fill="#ece7e1" fill-opacity="0.03"/>
    <rect x="262" y="82" width="100" height="10" rx="5" fill="#ece7e1" fill-opacity="0.14"/>
    <rect x="262" y="104" width="118" height="8" rx="4" fill="#ece7e1" fill-opacity="0.08"/>
    <rect x="262" y="124" width="80" height="8" rx="4" fill="#f24b4b" fill-opacity="0.5"/>
  </g>

  <g transform="translate(590 720)">
    <rect x="0" y="0" width="890" height="180" rx="12" fill="url(#gt-card)" stroke="#ece7e1" stroke-opacity="0.1"/>
    <rect x="28" y="28" width="180" height="14" rx="7" fill="#ece7e1" fill-opacity="0.18"/>
    <g fill="#ece7e1" fill-opacity="0.07">
      <rect x="28" y="72" width="820" height="10" rx="5"/>
      <rect x="28" y="100" width="700" height="10" rx="5"/>
      <rect x="28" y="128" width="770" height="10" rx="5"/>
    </g>
    <rect x="28" y="72" width="240" height="10" rx="5" fill="#f24b4b" fill-opacity="0.55"/>
  </g>

  <rect width="1600" height="1000" filter="url(#gt-grain)" opacity="0.035" style="mix-blend-mode:soft-light"/>
</svg>

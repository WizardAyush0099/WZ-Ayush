<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMax meet">
  <!--
    PLACEHOLDER ARTWORK — replace with your own photo/render.
    Drop a transparent PNG/WebP at /assets/hero-figure.webp (subject anchored
    to the bottom-centre, ~1600px tall, breathing room on the right) and point
    `assets.heroFigure` in src/data/content.ts at it.
  -->
  <defs>
    <!-- Cloth: deep at the outside, lifted in the middle so the form reads -->
    <linearGradient id="cloth" x1="0.15" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#0b080a"/>
      <stop offset="34%" stop-color="#191316"/>
      <stop offset="62%" stop-color="#0e0a0c"/>
      <stop offset="100%" stop-color="#040303"/>
    </linearGradient>
    <linearGradient id="clothLower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d090b" stop-opacity="0"/>
      <stop offset="70%" stop-color="#050304" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#050304" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241a1d"/>
      <stop offset="55%" stop-color="#171114"/>
      <stop offset="100%" stop-color="#0a0709"/>
    </linearGradient>
    <linearGradient id="hair" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#161014"/>
      <stop offset="60%" stop-color="#0b080a"/>
      <stop offset="100%" stop-color="#050304"/>
    </linearGradient>

    <!-- Rim light sweeping down the right contour -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8f8f" stop-opacity="0"/>
      <stop offset="14%" stop-color="#ff6a6a" stop-opacity="0.95"/>
      <stop offset="46%" stop-color="#d61f26" stop-opacity="0.75"/>
      <stop offset="78%" stop-color="#8c0b10" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5e070b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity="0"/>
      <stop offset="22%" stop-color="#ff4d4d" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#8c0b10" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8c0b10" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2f2"/>
      <stop offset="26%" stop-color="#ff4a4a"/>
      <stop offset="64%" stop-color="#b31115" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b31115" stop-opacity="0"/>
    </radialGradient>

    <!-- Key light spilling from the upper right onto the shoulder/face -->
    <radialGradient id="keylight" cx="78%" cy="20%" r="62%">
      <stop offset="0%" stop-color="#ff9a9a" stop-opacity="0.30"/>
      <stop offset="42%" stop-color="#b31115" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b31115" stop-opacity="0"/>
    </radialGradient>

    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="eyeGlow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="bodyClip">
      <path d="M450 352 C334 352 254 424 214 538 C154 700 122 950 92 1180
               C 300 1214 600 1214 808 1180
               C 778 950 746 700 686 538 C646 424 566 352 450 352 Z"/>
    </clipPath>
  </defs>

  <!-- Atmospheric halo behind the subject -->
  <ellipse cx="470" cy="620" rx="330" ry="470" fill="#8c0b10" opacity="0.30" filter="url(#halo)"/>

  <!-- Hair mass behind the head -->
  <path d="M520 232 C616 204 684 266 652 362 L592 356 C620 298 574 244 522 258 Z" fill="url(#hair)"/>

  <!-- Coat / body -->
  <path d="M450 352 C334 352 254 424 214 538 C154 700 122 950 92 1180
           C 300 1214 600 1214 808 1180
           C 778 950 746 700 686 538 C646 424 566 352 450 352 Z"
        fill="url(#cloth)"/>

  <!-- Fabric folds, clipped to the coat so they read as volume, not lines -->
  <g clip-path="url(#bodyClip)" fill="none" stroke-linecap="round">
    <path d="M392 380 C372 560 356 860 348 1180" stroke="#050304" stroke-width="16" opacity="0.85"/>
    <path d="M520 384 C548 560 566 870 572 1180" stroke="#050304" stroke-width="20" opacity="0.8"/>
    <path d="M300 470 C292 640 286 900 300 1176" stroke="#050304" stroke-width="13" opacity="0.6"/>
    <path d="M636 470 C648 650 654 910 640 1176" stroke="#050304" stroke-width="13" opacity="0.6"/>
    <path d="M450 420 C446 620 444 900 450 1180" stroke="#1d1519" stroke-width="9" opacity="0.45"/>
  </g>

  <!-- Shoulder plane catching the key light -->
  <g clip-path="url(#bodyClip)">
    <path d="M520 356 C640 396 704 486 724 566 C660 512 588 468 512 448 Z" fill="url(#keylight)"/>
  </g>

  <!-- Bottom fade into darkness -->
  <path d="M92 1000 C 300 1060 600 1060 808 1000 L808 1200 L92 1200 Z" fill="url(#clothLower)"/>

  <!-- Rim light: soft pass, then the crisp contour -->
  <path d="M688 540 C748 700 780 950 808 1180"
        fill="none" stroke="url(#rimSoft)" stroke-width="26" stroke-linecap="round" opacity="0.85"/>
  <path d="M688 540 C748 700 780 950 808 1180"
        fill="none" stroke="url(#rim)" stroke-width="6" stroke-linecap="round"/>
  <path d="M640 402 C684 448 704 496 708 546"
        fill="none" stroke="url(#rim)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Popped collar -->
  <path d="M362 372 C348 296 372 254 404 244 L450 350 L496 244 C528 254 552 296 538 372
           C500 398 400 398 362 372 Z" fill="#100c0f"/>
  <path d="M404 244 L450 350 L496 244 C468 286 430 288 404 244 Z" fill="#060405" opacity="0.9"/>

  <!-- Neck -->
  <path d="M418 318 L482 318 L482 374 L418 374 Z" fill="#0d090b"/>

  <!-- Head, shaded from the back-left -->
  <ellipse cx="452" cy="284" rx="76" ry="90" fill="url(#skin)"/>

  <!-- Hair -->
  <path d="M376 266 C384 194 424 160 452 160 C508 160 530 208 528 262
           C514 234 486 224 462 238 C484 266 508 294 520 324
           C486 298 440 294 410 318 C420 290 402 276 376 266 Z" fill="url(#hair)"/>
  <path d="M470 182 C510 196 526 236 524 268 C512 240 492 218 464 208 Z" fill="#1e161a" opacity="0.55"/>

  <!-- Eyes: the single warm point in the frame -->
  <g filter="url(#eyeGlow)">
    <ellipse cx="420" cy="304" rx="21" ry="12" fill="url(#eye)"/>
    <ellipse cx="482" cy="304" rx="21" ry="12" fill="url(#eye)"/>
    <ellipse cx="420" cy="304" rx="4" ry="6" fill="#ffe9e9"/>
    <ellipse cx="482" cy="304" rx="4" ry="6" fill="#ffe9e9"/>
  </g>

  <!-- Ground contact shadow -->
  <ellipse cx="450" cy="1178" rx="300" ry="42" fill="#050304" opacity="0.9" filter="url(#soften)"/>
</svg>

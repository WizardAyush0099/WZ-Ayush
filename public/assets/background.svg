<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- PLACEHOLDER ARTWORK — atmospheric backdrop. Replace with /assets/background.webp -->
  <defs>
    <radialGradient id="atmos" cx="68%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#5e070b" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#2c0507" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050304" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a6a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#b31115" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b31115" stop-opacity="0"/>
    </radialGradient>
    <filter id="g">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#050304"/>
  <rect width="1600" height="900" fill="url(#atmos)"/>
  <circle cx="1090" cy="330" r="230" fill="url(#moon)"/>
  <circle cx="1090" cy="330" r="118" fill="#e0171c" opacity="0.14"/>
  <rect width="1600" height="900" filter="url(#g)" opacity="0.5"/>
</svg>

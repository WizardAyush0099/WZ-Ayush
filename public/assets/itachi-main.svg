<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMax meet">
  <!--
    PLACEHOLDER ARTWORK — replace this file with your own Itachi render.
    Drop a transparent PNG/WebP here as /assets/itachi-main.webp and update
    the path in src/data/content.ts (assets.itachiMain). Keep the figure
    anchored to the bottom-centre and leave breathing room on the right.
  -->
  <defs>
    <linearGradient id="cloak" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#201a1f"/>
      <stop offset="42%" stop-color="#0f0b0e"/>
      <stop offset="100%" stop-color="#050304"/>
    </linearGradient>
    <linearGradient id="cloakRim" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#8c0b10" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8c0b10" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b646b"/>
      <stop offset="50%" stop-color="#2c3237"/>
      <stop offset="100%" stop-color="#171b1f"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4e4"/>
      <stop offset="30%" stop-color="#ff3b3b"/>
      <stop offset="70%" stop-color="#b31115" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b31115" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Red rim light behind the figure -->
  <path d="M450 360 C330 360 250 430 210 540 C150 700 120 950 90 1180 L810 1180 C780 950 750 700 690 540 C650 430 570 360 450 360 Z"
        fill="#8c0b10" opacity="0.5" filter="url(#soft)"/>

  <!-- Ponytail / hair mass behind head -->
  <path d="M520 236 C612 210 678 268 650 360 L596 356 C622 300 578 250 522 262 Z" fill="#0a0709"/>

  <!-- Cloak / body -->
  <path d="M450 358 C332 358 250 430 210 542 C150 704 118 952 88 1180
           C 300 1210 600 1210 812 1180
           C 782 952 750 704 690 542 C650 430 568 358 450 358 Z"
        fill="url(#cloak)"/>

  <!-- Rim light on the cloak edge -->
  <path d="M692 540 C752 700 784 952 812 1180"
        fill="none" stroke="url(#cloakRim)" stroke-width="7" stroke-linecap="round"/>
  <path d="M636 404 C680 452 700 500 704 548"
        fill="none" stroke="url(#cloakRim)" stroke-width="5" stroke-linecap="round"/>

  <!-- High popped collar -->
  <path d="M366 372 C352 300 372 262 402 250 L450 352 L498 250 C528 262 548 300 534 372 C500 396 400 396 366 372 Z"
        fill="#100c0f"/>

  <!-- Neck -->
  <path d="M420 322 L480 322 L480 372 L420 372 Z" fill="#141014"/>

  <!-- Head -->
  <ellipse cx="450" cy="284" rx="76" ry="90" fill="#161115"/>

  <!-- Hair bangs -->
  <path d="M376 268 C384 196 424 162 452 162 C506 162 528 210 526 262
           C512 236 486 226 462 240 C484 268 508 296 520 326
           C486 300 440 296 410 320 C420 292 402 278 376 268 Z" fill="#0b080a"/>

  <!-- Headband with scratched hidden-leaf mark -->
  <path d="M372 236 L528 236 L528 268 L372 268 Z" fill="#0d0a0c"/>
  <path d="M384 240 L516 240 L516 264 L384 264 Z" fill="url(#metal)"/>
  <circle cx="418" cy="252" r="8" fill="#0d0a0c"/>
  <path d="M406 244 L430 260 M466 244 L490 260" stroke="#0d0a0c" stroke-width="3" stroke-linecap="round"/>
  <path d="M384 270 L516 258" stroke="#0a0709" stroke-width="5" stroke-linecap="round"/>

  <!-- Eyes (Mangekyo glow) -->
  <g filter="url(#glow)">
    <ellipse cx="420" cy="308" rx="22" ry="14" fill="url(#eyeGlow)"/>
    <ellipse cx="480" cy="308" rx="22" ry="14" fill="url(#eyeGlow)"/>
    <ellipse cx="420" cy="308" rx="5" ry="7" fill="#ffd9d9"/>
    <ellipse cx="480" cy="308" rx="5" ry="7" fill="#ffd9d9"/>
  </g>

  <!-- Akatsuki red clouds -->
  <g fill="#0a0709" stroke="#c0161c" stroke-width="3" stroke-linejoin="round" opacity="0.92">
    <g transform="translate(238,650) scale(1.15)">
      <path d="M0 20 C0 9 13 4 22 9 C27 -2 47 -2 51 9 C64 4 74 12 71 25 C73 34 61 41 50 36 C44 47 24 47 18 36 C7 41 -3 33 0 20 Z"/>
    </g>
    <g transform="translate(508,812) scale(1.4)">
      <path d="M0 20 C0 9 13 4 22 9 C27 -2 47 -2 51 9 C64 4 74 12 71 25 C73 34 61 41 50 36 C44 47 24 47 18 36 C7 41 -3 33 0 20 Z"/>
    </g>
    <g transform="translate(288,972) scale(1.25)">
      <path d="M0 20 C0 9 13 4 22 9 C27 -2 47 -2 51 9 C64 4 74 12 71 25 C73 34 61 41 50 36 C44 47 24 47 18 36 C7 41 -3 33 0 20 Z"/>
    </g>
  </g>

  <!-- Ground shadow fade -->
  <rect x="60" y="1080" width="780" height="120" fill="#050304" opacity="0.85"/>
</svg>
